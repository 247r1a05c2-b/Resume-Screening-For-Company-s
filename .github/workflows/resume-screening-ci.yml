name: Resume Screening CI

on:
  push:
    branches: [main, readiness/matching-validation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: resume_screening_project/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn pytest
      - name: Run matcher regression tests
        env:
          PYTHONPATH: resume_screening_project
        run: python -m pytest -q resume_screening_project/tests
